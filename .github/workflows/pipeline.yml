# Pipeline for brainboost_configuration_package.
# Runs on every push to main, on pull requests, and by hand (Actions -> Pipeline -> Run workflow).
# Status of every project's last run: dashboard -> ST Backend -> Pipelines.
name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Create virtualenv
        run: |
          uv venv --python 3.11 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          uv pip install -e "."
          uv pip install pytest
      - name: Test
        run: python -m pytest -q
